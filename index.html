<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Entreno</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#000;--panel:#121212;--panel2:#212121;--line:#2c2c2c;--txt:#f8f8f8;--mut:#9e9e9e;--acc:#ff3b30;--ink:#fff;--ok:#38d9a9;--warn:#ffb020;--bad:#ff6363;--red:#ff6b61}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px;font-feature-settings:"cv11","ss01";letter-spacing:-.1px;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 12px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:6px 0 4px}h2{font-size:17px;margin:20px 0 8px}
@font-face{font-family:Inter;src:url(inter.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
h1,h2,.disp,.exn,.kpn,.tag,.dname,.dnum,.plk,button.pri,.kpok,.fink,.finn,.fstat b,.fstat span{font-family:Inter,-apple-system,sans-serif;text-transform:uppercase;letter-spacing:-.3px;font-weight:800}
.dnum,.plk,.fink,.fstat span,.tag{letter-spacing:.8px;font-weight:700}
h1{font-size:30px;line-height:1.08;margin:10px 0 8px}h2{font-size:18px;margin:26px 0 10px;color:#fff}
button.pri{font-size:15px;letter-spacing:.6px;border-radius:999px}h3{margin:0 0 8px;font-size:17px}
p{margin:6px 0}.mut{color:var(--mut)}.small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.warn{border-color:var(--warn)}
button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:700}
button.danger{color:var(--bad)}button.ghost{background:transparent}
button.sm{padding:6px 10px;font-size:13px}button.block{display:block;width:100%;margin-top:8px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}
.day{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-top:8px}
.day b{display:block}.tag{white-space:nowrap;font-size:11px;font-weight:700;background:var(--acc);color:var(--ink);border-radius:6px;padding:2px 6px;margin-left:6px}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exn{font-weight:700;font-size:16px}.exn.r{color:var(--red)}
.note{font-size:13px;color:var(--mut);margin:2px 0 6px}
.set{border-top:1px solid var(--line);padding:8px 0}
.set.done{opacity:.75}
.slab{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.prev{font-size:12px;color:var(--mut);margin-top:2px}
.hint{font-size:12px;color:var(--ok);font-weight:600}
.inp{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px;margin-top:6px;align-items:end}
.inp.bi{grid-template-columns:1fr 1fr 1fr 1fr 44px}
input.pre{color:var(--mut);font-style:italic}
.ds{display:block;height:9px;border-radius:5px;background:var(--line);margin:7px 2px 0;overflow:hidden}.ds b{display:block;height:100%;background:#4a4a4a;border-radius:3px}.ds.g b{background:var(--acc)}.dn{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-top:3px}.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:8px}.seg button{border:0;background:none;color:var(--mut);padding:4px 12px;font:inherit;font-size:13px;font-weight:600}.seg button.on{background:var(--acc);color:#121212}.bwc{touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair;display:block}.bwro{min-height:44px;margin:8px 0 2px}.bwro b{font-size:22px}.bwro .d{font-size:13px;font-weight:600;margin-left:6px}.stp{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.stp .big{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.5px}.stp .big small{font-size:14px;font-weight:600;color:var(--mut);letter-spacing:0}.stp .pb{height:14px;border-radius:7px;background:var(--line);margin:10px 0 6px;overflow:hidden}.stp .pb b{display:block;height:100%;background:#4a4a4a;border-radius:7px}.stp .pb.g b{background:var(--acc)}
.inp label{font-size:11px;color:var(--mut);display:block;margin-bottom:2px}
input,textarea,select{font:inherit;font-size:16px;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 8px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.tick{height:42px;width:44px;padding:0;font-size:20px;border-radius:10px}
.tick.on{background:var(--ok);border-color:var(--ok);color:#002b1d}
.slow{color:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;background:#000000f2;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav a{flex:1;max-width:140px;text-align:center;padding:10px 4px 8px;color:var(--mut);text-decoration:none;font-size:12px;font-weight:600}
nav a.on{color:var(--acc)}nav a span{display:block;font-size:19px}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));z-index:25;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px #0008;font-weight:700;font-variant-numeric:tabular-nums}
#timer[hidden]{display:none}
#timer span{white-space:nowrap}
.stro{text-align:center;font-size:15px;margin:2px 0 8px;min-height:20px}.stro b{font-size:18px;color:#fff}
#stc .stb{transition:opacity .15s}#stc:has(.stb.sel) .stb:not(.sel){opacity:.45}
.seg{display:flex;gap:6px;background:#121212;border:1px solid var(--line);border-radius:14px;padding:4px;margin:10px 0}.seg button{flex:1;border:0;background:none;padding:10px 6px;font-weight:700;border-radius:10px}.seg button.on{background:#fff;color:#000}
.dtot{display:flex;gap:16px;align-items:center}.dk{text-align:center;min-width:92px}.dk b{display:block;font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.5px;font-size:34px;line-height:1;color:#fff}.dk span{font-size:11px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
.dbars{flex:1;display:grid;gap:8px}.dbar .row{gap:4px;font-size:13px}.dbar i{display:block;height:6px;border-radius:3px;background:#24262a;margin-top:3px;overflow:hidden}.dbar i b{display:block;height:100%;border-radius:3px}
.meal .mn{font-size:20px;color:#fff}.meal .mk{font-weight:700;font-size:14px}.meal ul{margin:8px 0 6px;padding-left:18px}.meal li{margin:3px 0}.meal li.off{opacity:.4;text-decoration:line-through}.meal .alt{display:block;font-size:12px;color:var(--mut);text-decoration:none}
.mm{display:flex;gap:12px;font-size:12px;color:var(--mut);font-weight:600}.mm i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
details.card summary{cursor:pointer}details.card ul{padding-left:18px;margin:8px 0 0}details.card li{margin:4px 0}#timer small{font-weight:600}
.clk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:calc(8px - env(safe-area-inset-top)) -12px 2px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;position:sticky;top:0;z-index:6;background:#000}
.clk>div{background:#121212;border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.clk span{display:block;font-size:11px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clk b{display:block;font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.5px;font-size:26px;line-height:1.15;color:#fff;font-variant-numeric:tabular-nums}
.clk .sw{display:flex;align-items:center;gap:6px}.clk .sw>div{flex:1;min-width:0}
.clk .sw b{color:#fff}.clk .sw.on b{color:var(--acc)}
.swb{width:44px;height:44px;border-radius:50%;padding:0;font-size:18px;background:var(--acc);color:var(--ink);border:0;flex:none}
.sw.on .swb{background:#2c2c2c;color:#fff}
.swr{width:34px;height:34px;border-radius:50%;padding:0;font-size:16px;flex:none}
.extime{color:var(--mut);font-weight:600;font-size:13px;white-space:nowrap}

/* --- Estilo negro / tarjetas grandes / reproductor --- */
.dcard{position:relative;display:block;width:100%;min-height:118px;text-align:left;margin-top:12px;padding:16px 18px;border-radius:18px;overflow:hidden;border:1px solid #ffffff14;background:linear-gradient(135deg,#262626,#0d0d0d 75%)}
.dcard .dnum{display:block;font-size:13px;color:#ffffffa8;letter-spacing:1.5px}
.dcard .dname{display:block;font-size:26px;line-height:1.05;color:#fff;margin:4px 0 2px;max-width:75%}
.dcard .dsub{display:block;font-size:13px;color:#ffffffa0}
.dcard .dico{position:absolute;right:-6px;bottom:-14px;font-size:92px;opacity:.22;filter:grayscale(1);transform:rotate(-8deg);pointer-events:none}
.dcard .tag{position:absolute;top:14px;right:14px;margin:0;font-size:13px;padding:3px 8px}
.dcard.done{border-color:#38d9a988}.dcard.missed{border-color:#ffb02088}.dcard.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.card.today{background:linear-gradient(160deg,#ffffff22,#000 70%);border-color:#ffffff66;padding:18px}
.card.today h2,.card h2{margin:4px 0;font-size:24px;line-height:1.1}
.plbar{display:flex;gap:4px;flex:1;margin:0 10px}.plbar i{flex:1;height:5px;border-radius:3px;background:#2c2c2c}.plbar i.d{background:var(--ok)}.plbar i.c{background:#fff}
.plk{font-size:13px;color:var(--mut);letter-spacing:1.5px;margin-top:16px}
.ex.pl{background:none;border:0;padding:0;margin:6px 0 0}
.ex.pl .exn{font-size:28px;line-height:1.08;color:#fff}.ex.pl .exn.r{color:var(--red)}
.ex.pl .note{font-size:14px}
.ex.pl .set{padding:12px 0}.ex.pl .slab{font-size:14px}
.ex.pl input{font-size:22px;padding:11px 10px;font-weight:700}.ex.pl .tick{height:50px;width:50px}.ex.pl .inp{grid-template-columns:1fr 1fr 50px}.ex.pl .inp.bi{grid-template-columns:1fr 1fr 1fr 1fr 50px}
.plnav{display:flex;gap:10px;margin:18px 0 6px}.plnav button{flex:1;padding:14px;font-weight:700}
.plend h1{font-size:34px;margin-top:22px}
#modal .sheet.fin{max-height:100vh;height:100%;border-radius:0;border:0;background:#000;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:calc(30px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.fink{font-size:15px;letter-spacing:3px;color:var(--acc)}
.finn{font-size:30px;line-height:1.08;color:#fff;margin:6px 0 14px}
.ring{position:relative;width:180px;height:180px;margin:6px auto 14px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Inter,sans-serif;font-weight:800;letter-spacing:-.5px;font-size:44px;color:#fff}.ring b small{font-size:13px;color:var(--mut);letter-spacing:2px}
.fstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.fstat{background:#121212;border:1px solid var(--line);border-radius:14px;padding:12px 6px}.fstat b{display:block;font-size:24px;color:#fff;line-height:1.1}.fstat span{font-size:12px;color:var(--mut);letter-spacing:1.5px}
.fin .rec{text-align:left}
#kp{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:12px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px #0009;max-width:640px;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#kp[hidden]{display:none}
.kph{display:flex;gap:10px;align-items:flex-start}.kph>div{flex:1;min-width:0}
.kpn{font-size:18px;font-weight:800;line-height:1.15}.kpn.r{color:var(--red)}
.kpx{padding:6px 12px}
.kpfs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:10px 0}
.kpfs.bi{grid-auto-flow:row;grid-template-columns:1fr 1fr}
.kpf{text-align:left;padding:6px 12px;border-radius:12px}
.kpf span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.kpf b{display:block;font-size:30px;line-height:38px;height:38px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.kpfs.bi .kpf b{font-size:24px;line-height:32px;height:32px}
.kpf b.sug{color:var(--mut);font-style:italic;font-weight:600}
.kpf.on{border-color:var(--acc);background:#ffffff14}.kpf.slow span{color:var(--red)}
.kpc{display:inline-block;width:2px;height:.9em;background:var(--acc);margin-left:2px;vertical-align:-2px;animation:kpb 1s steps(1) infinite}@keyframes kpb{50%{opacity:0}}
.kpg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpg button{font-size:26px;font-weight:700;height:54px;border-radius:12px;padding:0}
.kpg button:active,.kpok:active{filter:brightness(1.35)}
.kpok{display:block;width:100%;margin-top:8px;height:56px;font-size:20px;font-weight:800;background:var(--acc);color:var(--ink);border-color:var(--acc)}
body.kpon #timer{bottom:calc(var(--kph,480px) + 8px)}
body.kpon main{padding-bottom:var(--kph,480px)!important}
input.kpon{outline:2px solid var(--acc);outline-offset:-1px}
.set.kpcur{background:#ffffff10;border-radius:8px;box-shadow:0 0 0 6px #ffffff10}
input[readonly]{caret-color:transparent;cursor:pointer}
#timer.end{border-color:var(--acc);color:var(--acc)}
#modal{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:85vh;overflow:auto}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:var(--txt);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0}.chk input{width:22px;height:22px}
.legend{font-size:12px;color:var(--mut)}
svg text{fill:var(--mut);font-size:10px}
.set.done .slab span:first-child::before{content:"✓ ";color:var(--ok)}
.ex.ok{border-color:#38d9a988}.okb{color:var(--ok)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0}
.bar b{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.bar.g b{background:var(--ok)}
.strip{display:flex;gap:4px;margin:6px 0 2px}
.dot{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--mut);background:none;border:0;padding:0}
.dot i{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;max-width:42px;margin:5px auto 0;border-radius:50%;border:2px solid var(--line);font-style:normal;font-size:17px;background:var(--panel)}
.dot.done i{background:var(--ok);border-color:var(--ok);color:#002b1d;font-weight:800}
.dot.missed i{border-color:var(--warn);color:var(--warn);font-size:15px}
.dot.today{color:var(--acc)}.dot.today i{border-color:var(--acc);box-shadow:0 0 0 3px #ffffff33}
.dot.rest i{opacity:.45;font-size:14px}
.day.done{border-color:#38d9a966;background:#38d9a912}
.day.missed{border-color:#ffb02077}
.day .ico{font-size:22px;margin-right:10px}.day .tx{flex:1}
.tag.miss{background:var(--warn)}.tag.ok{background:var(--ok);color:#002b1d}
.today{border-color:var(--acc)}
.hero{display:flex;align-items:center;gap:12px}.hero .big{font-size:38px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--panel2);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--acc)}.stat span{font-size:11px;color:var(--mut)}
.rec{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti span{position:absolute;top:-30px;font-size:22px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin:2px 4px 2px 0;color:var(--mut)}

/* ===== v3 · formato THENX ===== */
body{background:#000}
main{padding-top:calc(4px + env(safe-area-inset-top))}
.card,.ex{background:#141414;border:0;border-radius:16px;padding:16px}
button{background:#1f1f1f;border:0;border-radius:12px}
button.ghost{background:none}
button.pri,.kpok{background:#fff;color:#000;border:0;border-radius:999px;padding:15px 18px;font-size:15px;letter-spacing:.2px;text-transform:none;font-weight:700}
button.pill2{background:#262626;color:#fff;border-radius:999px;padding:15px 18px;font-weight:600}
.tb{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:52px;margin:0 -2px 6px;position:relative}
.tb>b{text-align:center;font-size:17px;font-weight:600;letter-spacing:-.2px;text-transform:none}
.tbl,.tbr{display:flex}.tbr{justify-content:flex-end}
.ib{width:40px;height:40px;border-radius:50%;background:#1c1c1c;display:inline-flex;align-items:center;justify-content:center;padding:0;color:#fff;border:0}
.ib svg{width:18px;height:18px}
.ic{width:20px;height:20px;display:inline-block;vertical-align:-4px}
.cap{font-size:14px;color:#a3a3a3;font-weight:400;letter-spacing:0;text-transform:none;margin:0}
.hd{font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:-.6px;line-height:1.05;color:#fff;margin:4px 0 6px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.sh b{font-size:17px;font-weight:600;letter-spacing:-.2px;text-transform:none;color:#fff}
.sh span,.sh a{font-size:13px;color:#cfcfcf;text-decoration:underline;text-underline-offset:3px}
.hero2{padding:20px 18px 18px}.hero2 .sub{font-size:14px;color:#a3a3a3;margin:0 0 16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#1f1f1f;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:#e0e0e0}
.chip.ok{background:#16352b;color:#5ee2b5}
/* semana tipo calendario */
.wk{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;position:relative;margin:4px 0 2px}
.wk .l{text-align:center;font-size:12px;color:#8a8a8a;font-weight:500}
.wk .c{position:relative;display:flex;justify-content:center;align-items:center;height:44px;background:none;border:0;padding:0;color:#bdbdbd;font-weight:600;font-size:15px}
.wk .c.run::before{content:"";position:absolute;top:4px;bottom:4px;left:0;right:0;background:#262626}
.wk .c.run.s::before{left:50%;border-radius:0}.wk .c.run.e::before{right:50%}
.wk .c i{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal}
.wk .c.done i{background:#3a3a3a;color:#fff}
.wk .c.missed i{color:#ffb020}
.wk .c.rest i{color:#555}
.wk .c.today i{width:42px;height:42px;background:#fff;color:#000;font-weight:800;box-shadow:0 0 0 5px #ffffff22}

<script>
'use strict';
/* ================= El plan del entrenador (tal cual el PDF) ================= */
// Tipos de serie:
//  bi   → biserie: N reps con cadencia normal + X reps muy lentas con la mitad de peso
//  top  → serie al fallo dentro del rango
//  drop → al fallo con un % menos de peso que la serie anterior, sin descanso
//  str  → serie al fallo dentro del rango
//  act  → serie de activación con muy poco peso (descanso 30")
const bi = (reps, lab) => ({ t: 'bi', reps, lab });
const fail = (range, lab) => ({ t: 'top', range, lab });
const drop = pct => ({ t: 'drop', pct });
const str = (n, range, lab) => Array.from({ length: n }, () => ({ t: 'str', range, lab }));
const act = n => Array.from({ length: n }, () => ({ t: 'act', rest: 30 }));
const PLAN = [
  { id: 'd1', ico: '🧗', num: 1, n: 'Día 1 · Lunes · Pull (espalda)', s: 'Pull', ex: [

    { k: 'jalon', n: 'Jalón al pecho', sets: [bi(12), bi(10)] },
    { k: 'jalonsup', n: 'Jalón agarre supino', sets: [bi(12), bi(10)] },
    { k: 'remopolea', n: 'Remo polea baja', sets: [fail('8-10'), drop(10), drop(10)] },
    { k: 'remomanc', n: 'Remo mancuerna a una mano', note: 'Aguanta 1" atrás apretando', sets: str(3, '8-12') },
    { k: 'bicpolea', n: 'Bíceps barra recta polea baja', note: '1" apretando en máxima tensión', sets: str(3, '10-15') },
  ] },
  { id: 'd2', ico: '🦵', num: 2, n: 'Día 2 · Martes · Legs (pierna)', s: 'Legs', ex: [
    { k: 'ext1', n: 'Extensiones', sets: [bi(15), bi(12), bi(10)] },
    { k: 'sentmp', n: 'Sentadilla multipower', sets: [bi(12), bi(10)] },
    { k: 'prensa', n: 'Prensa profunda pies abajo', note: 'Sin llegar a arquear la lumbar', sets: [fail('8-10'), drop(20)] },
    { k: 'curlfem', n: 'Curl femoral', note: '2" de isotensión al final de la concéntrica', sets: str(3, '10-15') },
    { k: 'hack', n: 'Hack', sets: [bi(12, 'Medias reps: bajas del todo, subes solo hasta la mitad'), bi(12, 'Repeticiones completas')] },
    { k: 'ext2', n: 'Extensiones (final)', sets: [bi(15), bi(12), bi(10)] },
  ] },
  { id: 'd3', ico: '💪', num: 3, n: 'Día 3 · Miércoles · Push (empuje)', s: 'Push', ex: [
    { k: 'contractor', n: 'Contractor en máquina o cruces en polea', sets: [bi(12), bi(10)] },
    { k: 'pressplano', n: 'Press plano multipower o en máquina', sets: [bi(10), bi(8)] },
    { k: 'pressinc', n: 'Press inclinado', sets: [fail('8-10'), drop(20)] },
    { k: 'militar', n: 'Press militar multipower', sets: [fail('8-10'), drop(20)] },
    { k: 'posterior', n: 'Posterior en máquina', sets: [bi(15), bi(12)] },
    { k: 'latmanc', n: 'Elevaciones laterales con mancuernas', sets: [bi(15), bi(12)] },
    { k: 'latsent', n: 'Elevaciones laterales sentado', sets: str(3, '12-15') },
    { k: 'tricuerda', n: 'Tríceps cuerda polea alta', sets: str(3, '10-15') },
    { k: 'trinuca', n: 'Tríceps barra recta tras la cabeza en polea alta', sets: str(3, '10-15') },
  ] },
  { id: 'd5', ico: '🏋️', num: 5, n: 'Día 5 · Viernes · Cadena posterior', s: 'Posterior', ex: [
    { k: 'gironda_act', n: 'Remo polea baja agarre Gironda (activación)', note: 'Muy poco peso. Cada 3 reps aguanta 5" en máxima tensión apretando. 30" de descanso', sets: act(3) },
    { k: 'gironda', n: 'Remo polea baja agarre Gironda o neutro', sets: [bi(12), bi(10)] },
    { k: 'remo45', n: 'Remo con barra a 45°', sets: [fail('8-10'), drop(20)] },
    { k: 'curlfem_act', n: 'Curl femoral (activación)', note: 'Muy poco peso. Cada 3 reps aguanta 5" en máxima tensión apretando. 30" de descanso', sets: act(3) },
    { k: 'aductor', n: 'Aductor en máquina', note: 'Aprieta 2" en isotensión al final de la concéntrica', sets: str(3, '10-15') },
    { k: 'pmuerto', n: 'Peso muerto convencional desde bloques (8-10 cm)', sets: [fail('5-9', 'Fallo técnico'), fail('12-15', 'Fallo técnico')] },
  ] },
  { id: 'd6', ico: '🔥', num: 6, n: 'Día 6 · Sábado · Bíceps y tríceps + hombro', s: 'Brazo', ex: [
    { k: 'bicmanc', n: 'Bíceps mancuernas simultáneo', sets: [bi(15), bi(12)] },
    { k: 'barraz', n: 'Bíceps barra Z de pie', note: 'Aprieta 1" en fase de máxima tensión', sets: [bi(12), bi(10)] },
    { k: 'martillo', n: 'Martillo polea baja', sets: [bi(12), bi(10)] },
    { k: 'presscerr', n: 'Press cerrado con barra', sets: [bi(12), bi(10)] },
    { k: 'tricuerda6', n: 'Tríceps cuerda polea alta', sets: [bi(15), bi(12)] },
    { k: 'trinuca6', n: 'Tríceps barra polea alta trasnuca', sets: [bi(15), bi(12)] },
    { k: 'latbanco', n: 'Laterales con mancuernas de pie, pecho apoyado en el banco', sets: str(4, '15-20') },
    { k: 'latpolea', n: 'Laterales a una mano en polea baja, por detrás de la cadera', note: 'Parciales de mitad a final del recorrido en concéntrica, apretando arriba 1"', sets: str(4, '10-15') },
  ] },
];
const RED = new Set(['pullover', 'jalon', 'jalonsup', 'ext1', 'sentmp', 'hack', 'ext2', 'contractor', 'pressplano', 'posterior', 'latmanc', 'gironda', 'bicmanc', 'barraz', 'martillo', 'presscerr', 'tricuerda6', 'trinuca6', 'latbanco', 'latpolea']);
const REST = 120;
const DAY = Object.fromEntries(PLAN.map(d => [d.id, d]));
const EX = {}; PLAN.forEach(d => d.ex.forEach(e => { EX[e.k] = { ...e, day: d.id }; }));

/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
const nfmt = n => { const v = Math.round(Number(n) || 0), a = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (v < 0 ? '-' : '') + a; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmt = n => n == null ? '' : (Math.round(n * 100) / 100).toString().replace('.', ',');
const round05 = n => Math.round(n * 2) / 2;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const fdate = t => new Date(t).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function rangeTop(r) { const m = String(r || '').match(/(\d+)\s*-\s*(\d+)/); return m ? +m[2] : null; }
function setLabel(sp, i, ex) {
  if (sp.t === 'bi') return `Serie ${i + 1} · ${sp.reps} + X`;
  if (sp.t === 'top') return `Serie ${i + 1} · ${sp.range} al fallo${sp.lab ? ' (' + sp.lab.toLowerCase() + ')' : ''}`;
  if (sp.t === 'drop') return `Descendente · −${sp.pct}% al fallo`;
  if (sp.t === 'str') return `Serie ${ex.sets.slice(0, i).filter(x => x.t === 'str').length + 1} · ${sp.range} al fallo`;
  if (sp.t === 'act') return `Activación ${ex.sets.slice(0, i).filter(x => x.t === 'act').length + 1}`;
  return `Serie ${i + 1}`;
}
const e1rm = (w, r) => (w && r) ? w * (1 + r / 30) : 0;

/* ================= Almacenamiento en el dispositivo ================= */
let S = { sessions: {}, meta: { rev: 0, savedRev: 0, lastBackup: null } };
const LS = 'entreno_v1';
const IDB = {
  db: null,
  open() { return new Promise(res => { try { const r = indexedDB.open('entreno', 1); r.onupgradeneeded = () => r.result.createObjectStore('docs'); r.onsuccess = () => { this.db = r.result; res(true); }; r.onerror = () => res(false); r.onblocked = () => res(false); } catch (e) { res(false); } }); },
  all() { return new Promise((res, rej) => { const out = {}, t = this.db.transaction('docs'), c = t.objectStore('docs').openCursor(); c.onsuccess = () => { const k = c.result; if (k) { out[k.key] = k.value; k.continue(); } }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); }); },
  run(fn) { return new Promise((res, rej) => { const t = this.db.transaction('docs', 'readwrite'); fn(t.objectStore('docs')); t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
};
const Store = {
  dirty: new Set(), removed: new Set(), timer: null,
  mirror() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} },
  save(id, countsAsChange = true) { this.removed.delete(id); this.dirty.add(id); if (countsAsChange) { S.meta.rev++; this.dirty.add('meta'); } this.later(); },
  remove(id) { this.dirty.delete(id); this.removed.add(id); S.meta.rev++; this.dirty.add('meta'); this.later(); },
  later() { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 250); },
  async flush() {
    clearTimeout(this.timer); this.mirror();
    if (!IDB.db) return;
    const ds = [...this.dirty], rs = [...this.removed]; this.dirty.clear(); this.removed.clear();
    try {
      await IDB.run(st => { for (const id of ds) { const v = id === 'meta' ? S.meta : S.sessions[id]; if (v) st.put(clone(v), id); } for (const id of rs) st.delete(id); });
    } catch (e) {
      ds.forEach(i => this.dirty.add(i)); rs.forEach(i => this.removed.add(i));
      toast('No se pudo guardar en el dispositivo; se reintentará'); this.timer = setTimeout(() => this.flush(), 2000);
    }
  },
  async replaceAll() { if (IDB.db) { await IDB.run(st => st.clear()); } Object.keys(S.sessions).forEach(id => this.dirty.add(id)); this.dirty.add('meta'); await this.flush(); },
};
async function load() {
  const ok = await IDB.open();
  if (ok) {
    try {
      const docs = await IDB.all();
      if (Object.keys(docs).length) {
        for (const [k, v] of Object.entries(docs)) { if (k === 'meta') S.meta = { ...S.meta, ...v }; else S.sessions[k] = v; }
        return;
      }

  plgo(el) { plGo(+el.dataset.n); },
  photo(el) { ui.phFor = el.dataset.d; document.getElementById('phin').click(); },
  phdel(el) { Photos.set(el.dataset.d, null); render(); },
  dmode(el) { ui.dmode = el.dataset.m; ui.dmodeDay = dstr(Date.now()); render(); },
  sw() { const s = cur(); if (!s) return; const w = s.sw || (s.sw = { acc: 0, run: null, first: null }); if (w.run) { w.acc += Date.now() - w.run; w.run = null; } else { w.run = Date.now(); if (!w.first) w.first = w.run; } Store.save(s.id); render(); },
  swreset() { const s = cur(); if (!s) return; confirmBox('¿Poner el cronómetro a cero?', 'Poner a cero', () => { s.sw = null; Object.values(s.ex).forEach(L => L.forEach(x => delete x.st)); Store.save(s.id); closeModal(); render(); }, 'El tiempo por ejercicio volverá a contar desde que lo inicies.'); },
  plist() { ui.list = ui.list ? 0 : 2; kpClose(); render(); scrollTo(0, 0); },
  kpok() {
    const k = ui.kp; if (!k) return;
    if (k.mode === 'bw') { const el = $('#bwin'); if (!k.typed && el && el.value === '' && num(el.placeholder) != null) el.value = el.placeholder; kpClose(); actions.bwsave(); return; }
    kpCommit();
    const s = cur(), e = EX[k.k], sp = e.sets[k.i], x = s.ex[k.k][k.i], F = kpFields(sp), j = F.indexOf(k.f);
    if (j < F.length - 1) { kpGo(k.k, k.i, F[j + 1]); return; }
    if (!x.done) { const t = document.querySelector(`button.tick[data-k="${k.k}"][data-i="${k.i}"]`); if (t) actions.tick(t); if (!x.done) { kpGo(k.k, k.i, x.w == null ? 'w' : 'r'); return; } }
    const nx = kpNext(k.k, k.i);
    if (nx) kpGo(nx.k, nx.i, 'w'); else if (isPlayer()) { kpClose(); ui.sx = DAY[s.day].ex.length; render(); scrollTo(0, 0); } else { kpClose(); toast('¡Todas las series hechas! Pulsa «Terminar entreno» 💪'); }
  },
});
let plT = null;
document.addEventListener('touchstart', ev => { if (!isPlayer() || ev.target.closest('#kp,#modal,nav,textarea')) { plT = null; return; } const t = ev.touches[0]; plT = t.clientX > 30 ? { x: t.clientX, y: t.clientY } : null; }, { passive: true });
document.addEventListener('touchend', ev => { if (!plT || !isPlayer()) return; const t = ev.changedTouches[0], dx = t.clientX - plT.x, dy = t.clientY - plT.y; plT = null; if (Math.abs(dx) > 70 && Math.abs(dy) < 50) { const n = DAY[cur().day].ex.length; if (dx < 0 && ui.sx < n) plGo(1); else if (dx > 0 && ui.sx > 0) plGo(-1); } }, { passive: true });
document.querySelectorAll('.nvi').forEach(x => { x.innerHTML = IC[x.dataset.i]; });
const VIEWS = ['hoy', 'historial', 'progreso', 'dieta', 'mas'];
function route() { closeModal(); const h = location.hash.slice(1); ui.view = VIEWS.includes(h) ? h : 'hoy'; render(); scrollTo(0, 0); if (ui.view === 'progreso') Sheets.weights(); if (ui.view === 'dieta') Sheets.diet(); }
document.addEventListener('focusin', ev => { const el = ev.target; if (el.dataset && el.dataset.pre) { try { el.select(); } catch (e) {} } });
window.addEventListener('hashchange', route);
let backing = 0;
function goBack() { backing++; try { history.back(); } catch (e) { backing--; } }
function histSync() {
  if (backing) return;
  const st = history.state || {};
  if (ui.cur && ui.view === 'hoy' && !st.s) { try { history.pushState({ s: 1 }, ''); } catch (e) {} }
  else if (!ui.cur && st.s && !st.m) goBack();
}
window.addEventListener('popstate', ev => {
  const st = ev.state || {};
  if (backing) { backing--; if (!$('#modal').hidden && !st.m) { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; ui.confirm = null; } histSync(); return; }
  if (!$('#modal').hidden && !st.m) { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; ui.confirm = null; }
  if (ui.cur && !st.s && ui.view === 'hoy') { ui.cur = null; render(); scrollTo(0, 0); }
  else if (!ui.cur && st.s && !st.m) goBack();
});
document.getElementById('tabs').addEventListener('click', ev => {
  const a = ev.target.closest('a[data-v]');
  if (a && a.dataset.v === 'hoy' && ui.view === 'hoy' && ui.cur) { ev.preventDefault(); actions.leave(); }
});
window.addEventListener('pagehide', () => Store.flush());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') Store.flush(); else { Sheets.push(); Sheets.steps(true); Sheets.weights(); } });
setInterval(() => { if (document.visibilityState === 'visible') Sheets.steps(true); }, 30000);
window.addEventListener('online', () => Sheets.push());

(async function boot() {
  await load();
  const dr = openDraft(); if (dr) ui.cur = dr.id;
  try { if (navigator.storage && navigator.storage.persist) (await navigator.storage.persisted()) || (await navigator.storage.persist()); } catch (e) {}
  route();
  Sheets.push(); Sheets.steps(true); Sheets.weights(); Sheets.diet();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
